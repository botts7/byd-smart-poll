name: Bug report
description: Something Smart Poll did (or did not do) with your car
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Smart Poll has only been run on a few setups, so the details below matter.
        Please remove your VIN, location and anything else personal from logs before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include times if you can (eg "drove off at 08:10, Smart Poll stayed parked until 08:25").
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car model and region
      placeholder: eg Atto 3, EU
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant, BYD Vehicle integration, Smart Poll
      placeholder: eg HA 2026.11.1, BYD Vehicle 0.0.93, Smart Poll 0.3.0b2
    validations:
      required: true
  - type: dropdown
    id: phone
    attributes:
      label: Phone signals in use
      multiple: true
      options:
        - Android, Bluetooth connection sensor
        - Android Auto sensor
        - iPhone (companion app)
        - iPhone Shortcuts automation
        - None
  - type: input
    id: charger
    attributes:
      label: Charger and how it is in HA
      placeholder: eg Zappi via myenergi integration, or none (public charging only)
  - type: textarea
    id: mode
    attributes:
      label: Polling mode sensor
      description: The state and attributes of sensor.<car>_polling_mode at the time, if you have them.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Lines from custom_components.byd_smart_poll and custom_components.byd_vehicle around the time (debug logging helps).
      render: text
